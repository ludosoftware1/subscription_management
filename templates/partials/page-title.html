{% comment %}
Cabeçalho padrão de página: trilha (Início / seção / página) + título.
Uso: {% include "partials/page-title.html" with pagetitle="Seção" title="Título" %}
{% endcomment %}
<div class="page-header">
    <div>
        <nav aria-label="Trilha de navegação">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{% url 'home' %}">Início</a></li>
                {% if pagetitle %}<li class="breadcrumb-item">{{ pagetitle }}</li>{% endif %}
                <li class="breadcrumb-item active" aria-current="page">{{ title }}</li>
            </ol>
        </nav>
        <h1 class="page-header-title">{{ title }}</h1>
    </div>
</div>
