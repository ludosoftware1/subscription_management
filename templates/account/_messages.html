{% comment %}Mensagens nas telas de acesso (mesmo mapeamento de partials/messages.html, sem botão de fechar).{% endcomment %}
{% for message in messages %}
<div class="alert alert-{% if message.level_tag == 'error' %}danger{% elif message.level_tag == 'debug' %}secondary{% else %}{{ message.level_tag|default:'info' }}{% endif %} mb-3" role="{% if message.level_tag == 'error' %}alert{% else %}status{% endif %}">
    {{ message }}
</div>
{% endfor %}
