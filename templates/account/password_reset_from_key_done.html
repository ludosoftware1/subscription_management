{% extends 'account/base.html' %}
{% load static %}
{% block title %}Senha alterada{% endblock title %}

{% block content %}
<div class="p-lg-4 p-2 text-center">
    <span class="confirm-icon bg-success-subtle text-success" aria-hidden="true"><i class="ri-checkbox-circle-line"></i></span>

    <h1 class="fs-20 mt-3 mb-1">Senha alterada</h1>
    {% include "account/_messages.html" %}
    <p class="text-muted">Sua senha foi alterada. Use a nova senha para entrar.</p>

    <div class="mt-4">
        <a href="{% url 'account_login' %}" class="btn btn-success w-100">Ir para o login</a>
    </div>
</div>
{% endblock content %}
